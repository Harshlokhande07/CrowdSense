version: '3.8'

services:
  crowdsense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdsense_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Optional: Mount custom weights or persistent results volume
      - ./results:/app/results
      - ./scratch:/app/scratch
      # Optional: Mount local camera video or RTSP mapping
      # - ./crowd.mp4:/app/crowd.mp4:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
